name: Visual baselines (manual)

# Manual regeneration of the marketing preservation snapshot baselines
# for the CI runner OS (Linux). Font rendering + subpixel behaviour differ
# by OS, so Playwright records baselines per platform (`*-linux.png`).
# Local dev on Windows / macOS keeps its own `*-win32.png` / `*-darwin.png`
# baselines committed separately.
#
# Trigger from the Actions tab -> "Visual baselines (manual)" -> Run workflow.
# The job checks out the target branch, boots the marketing site, captures
# any missing snapshots, and pushes the new PNGs back to the branch.
#
# The workflow only writes new / updated snapshots; it never deletes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to capture baselines on"
        required: true
        default: "main"

concurrency:
  group: visual-baselines-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: capture and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Update snapshots
        env:
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_API_BASE: "https://api.edss.example"
        run: npm run test:visual:update

      - name: Commit new baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tests/visual/snapshot.spec.ts-snapshots

          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi

          git commit -m "chore(visual): capture linux marketing snapshot baselines

Auto-captured by the visual-baselines workflow on ${{ github.event.inputs.ref }}.
Regenerates any missing / stale *-linux.png baselines so the CI marketing
preservation snapshot suite can run against them."

          git push origin HEAD:${{ github.event.inputs.ref }}
