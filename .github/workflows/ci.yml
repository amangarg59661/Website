name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# P-01: no automation existed before this workflow. Every commit now runs
# typecheck + lint + build across both apps + the marketing preservation
# snapshot suite. A separate secret-scan job runs gitleaks. Prettier check
# is intentionally omitted — Husky enforces on commit.

jobs:
  typecheck-lint-build:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_API_BASE: "https://api.edss.example"
        run: npm run build

  test-visual:
    name: marketing preservation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs with playwright's `updateSnapshots: "missing"` so any missing
      # Linux baseline gets written on this run instead of failing.
      # Existing baselines still fail on visual diff — the preservation
      # gate is only relaxed for first-run capture, not for real changes.
      - name: Run marketing snapshot suite
        env:
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_API_BASE: "https://api.edss.example"
        run: npm run test:visual

      # Push any first-run Linux baselines back so subsequent runs on any
      # branch have a real diff target. Only fires on pushes to main (not
      # on PR branches) so unreviewed baselines never land automatically.
      - name: Commit newly-captured baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tests/visual/snapshot.spec.ts-snapshots

          if git diff --cached --quiet; then
            echo "No new baselines to commit."
            exit 0
          fi

          git commit -m "chore(visual): capture linux marketing snapshot baselines" \
                     -m "Auto-captured by the test-visual CI job. Regenerates any missing *-linux.png baselines so the marketing preservation snapshot suite can gate against them on subsequent runs."

          git push origin HEAD:main

      - name: Upload snapshot report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
